{% extends "base.html" %}
{% block content %}

<h2>Our Products</h2>

<div class="product-grid">
    {% for p in products %}
    <a href="/product/{{ p.id }}" class="card">
        <img src="{{ p.img }}" alt="">
        <h3>{{ p.name }}</h3>
        <p>₹{{ p.price }}</p>
    </a>
    {% endfor %}
</div>

{% endblock %}
